        status: 200
        content_type: application/json
        file: kubit-ai-inc-oauth-protected-resource.json
      - path: /.well-known/openid-configuration
        status: 200
        content_type: text/html
        real_document: false
        note: SPA catch-all returns HTML, not an OIDC discovery document
      - path: /.well-known/security.txt
        status: 200
        content_type: text/html
        real_document: false
        note: SPA catch-all returns HTML, not RFC 9116 security.txt
  - host: https://kubit.ai
    documents:
      - path: /.well-known/security.txt
        status: 404
      - path: /.well-known/openid-configuration
