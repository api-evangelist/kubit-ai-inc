method: searched
source: live probes of the Kubit host surface
notes: >-
  Only mcp.kubit.ai serves real /.well-known documents — the OAuth 2.0 discovery pair
  that fronts the hosted MCP server. app.kubit.ai and agent.kubit.ai return HTTP 200 for
  every path because they are single-page applications with catch-all routing; their
  responses are HTML, not discovery documents, and are recorded as such rather than saved.
hosts:
