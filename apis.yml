aid: kubit-ai-inc
name: Kubit AI, Inc.
description: >-
  Kubit is a warehouse-native digital analytics platform that runs product analytics
  directly against a customer's cloud data warehouse with no ETL, and bridges that
  behavioral data with LLM observability. Kubit maps clickstream behavior, intent, and
  sentiment onto LLM traces so teams building AI agents can debug and optimize them
  where they already work. Its semantic layer applies business definitions, data models,
  and governance policies before any query reaches the warehouse. Kubit's programmatic
  surface is a hosted Model Context Protocol server at mcp.kubit.ai, protected by OAuth
  2.1 with PKCE, plus first-party OpenTelemetry exporters and a set of published agent
  skills for Claude Code and Cursor. Kubit is backed by Insight Partners.
