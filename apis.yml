apis:
- aid: kubit-ai-inc:mcp
  name: Kubit MCP Server
  description: >-
    Kubit's hosted Model Context Protocol server. Exposes five tools — getUserContext,
    getSchema, createReport, getRawData, and searchKubit — that let an MCP-compatible
    IDE or assistant explore schemas, execute reports, retrieve raw data, and find
    existing reports in the Kubit platform. Protected by OAuth 2.1 authorization code
    with PKCE and dynamic client registration, scoped mcp:read and mcp:write, with
    access enforced by Kubit's role-based access controls.
  humanURL: https://docs.kubit.ai/docs/mcp-server
  baseURL: https://mcp.kubit.ai/mcp
